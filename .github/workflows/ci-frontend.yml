name: ci-frontend

# Porte de qualité bloquante du front — cf. spec §10.6. Ne se déclenche que sur
# des changements dans web/ ou sur ce fichier lui-même : une PR qui ne touche
# que backend/ ne doit pas lancer cette CI.
on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/ci-frontend.yml"
  push:
    paths:
      - "web/**"
      - ".github/workflows/ci-frontend.yml"

permissions:
  contents: read

jobs:
  ci-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm --filter web run lint

      - name: tsc --noEmit
        run: pnpm --filter web run typecheck

      - name: vitest
        run: pnpm --filter web run test

      - name: next build
        run: pnpm --filter web run build
