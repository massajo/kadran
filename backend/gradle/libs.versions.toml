# Catalogue de versions — source unique de vérité des dépendances du back.
# Toute version se déclare ici, jamais en dur dans un build.gradle.kts.

[versions]
kotlin        = "2.2.0"
springBoot    = "4.1.0"
springDepMgmt = "1.1.7"
detekt        = "1.23.8"
ktlint        = "14.2.0"
archunit      = "1.5.0"
kotest        = "6.2.4"
mockk         = "1.14.11"
# Persistance — versions alignees sur celles que pilote le BOM Spring Boot 4.1.0 :
# les declarer ici les rend visibles et diffables, sans creer d'ecart avec le BOM.
#
# Seule exception assumee : le pilote PostgreSQL devance le BOM (qui epingle 42.7.11).
# Le 42.7.11 embarque un `scram-client` vulnerable a CVE-2026-54291 — contournement de
# la protection contre l'homme du milieu par retrogradation de SCRAM-SHA-256-PLUS — et
# la porte Trivy de la spec §10.6 refuse toute HIGH. Montee de patch a l'interieur de
# la meme mineure : a realigner sur le BOM des qu'il rattrape.
postgresql    = "42.7.13"
liquibase     = "5.0.3"
testcontainers = "2.0.5"
# Outillage Liquibase hors BOM : plugin Gradle et son analyseur de ligne de commande.
liquibaseGradle = "3.1.0"
picocli       = "4.7.7"

[libraries]
# --- persistance ---
postgresql     = { module = "org.postgresql:postgresql",     version.ref = "postgresql" }
liquibase-core = { module = "org.liquibase:liquibase-core",  version.ref = "liquibase" }
# Requis par le plugin Gradle Liquibase 3.x sur sa configuration `liquibaseRuntime`.
picocli        = { module = "info.picocli:picocli",          version.ref = "picocli" }

# --- test : socle commun ---
kotest-runner     = { module = "io.kotest:kotest-runner-junit5",     version.ref = "kotest" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core",   version.ref = "kotest" }
kotest-property   = { module = "io.kotest:kotest-property",          version.ref = "kotest" }
mockk             = { module = "io.mockk:mockk",                     version.ref = "mockk" }
archunit-junit5   = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# Testcontainers 2.x prefixe tous ses modules par `testcontainers-` : `org.testcontainers:postgresql`
# et `org.testcontainers:junit-jupiter` n'existent plus sous leurs anciens noms.
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql",    version.ref = "testcontainers" }
testcontainers-junit      = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }

# --- déclarées ici pour être appliquées depuis buildSrc ---
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
# Fournit l'id `org.jetbrains.kotlin.plugin.spring` : ouvre les classes annotees Spring,
# que Kotlin declare `final` par defaut.
kotlin-allopen-plugin = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
spring-depmgmt-gradle-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "springDepMgmt" }

[plugins]
kotlin-jvm     = { id = "org.jetbrains.kotlin.jvm",           version.ref = "kotlin" }
kotlin-spring  = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot    = { id = "org.springframework.boot",           version.ref = "springBoot" }
spring-depmgmt = { id = "io.spring.dependency-management",    version.ref = "springDepMgmt" }
liquibase      = { id = "org.liquibase.gradle",               version.ref = "liquibaseGradle" }
