# Propriétés de la construction Gradle du back.

# Le plugin Liquibase nomme ses tâches d'après les commandes de la CLI (`update`,
# `rollbackCount`, `dropAll`…). Sans préfixe, `./gradlew update` serait ambigu et
# `dropAll` dangereusement banal au milieu des tâches Gradle. Le préfixe donne les
# noms documentés dans CLAUDE.md §5 : `liquibaseUpdate`, `liquibaseRollbackCount`.
liquibaseTaskPrefix=liquibase
