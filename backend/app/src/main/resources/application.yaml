spring:
  application:
    name: kadran

  # Aucun secret en dur : des variables d'environnement, dont les valeurs par défaut
  # sont celles de la base de développement locale (spec §10.6, « aucun secret dans une
  # image, toute configuration par variable d'environnement »).
  datasource:
    url: ${KADRAN_DB_URL:jdbc:postgresql://localhost:5432/kadran}
    username: ${KADRAN_DB_USER:kadran}
    password: ${KADRAN_DB_PASSWORD:kadran}

  # Les migrations s'appliquent au démarrage : une base et un binaire ne peuvent pas
  # diverger silencieusement. Le changelog maître est le seul point d'entrée (spec §11.1).
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # **Explicite, et non accessoire** (KDN-136). Le rôle applicatif s'appelle `kadran`
    # (`KADRAN_DB_USER`), et depuis que le schéma opérationnel porte le même nom, PostgreSQL
    # résout `"$user"` — premier élément du `search_path` par défaut, `"$user", public` — sur
    # ce schéma désormais réel. `current_schema()` y bascule donc silencieusement dès que
    # `kadran` existe, et Liquibase, livré sans indication contraire, y chercherait ses
    # propres `databasechangelog`/`databasechangeloglock` — vides, puisqu'ils vivent dans
    # `public` (hors périmètre applicatif). Sans ce réglage, **tout redémarrage suivant la
    # première migration** croirait la base vierge et rejouerait le changelog entier contre
    # des objets déjà là. Constaté en vérifiant KDN-136 sur une base réelle : un second
    # `liquibaseUpdate` créait de lui-même un `kadran.databasechangelog` vide plutôt que de
    # lire celui de `public`.
    liquibase-schema: kadran

  # La journée d'exploitation et toutes les agrégations reposent sur Europe/Paris (§4.3).
  jackson:
    time-zone: Europe/Paris

# Journalisation structurée (spec §10.7.1) — support **natif** de Spring Boot, aucune
# dépendance externe : le JSON ajouté après coup obligerait à réécrire chaque appel de log
# et chaque règle d'extraction en aval. Les propriétés `logging.structured.*` sont vérifiées
# contre Spring Boot 4.1 ; elles n'ont pas changé de nom depuis la 3.4.
#
# Format `ecs` : il porte `service.name` (repris de `spring.application.name`), `log.level`,
# `log.logger` et une décomposition normalisée des exceptions, que tout agrégateur sait lire.
# Les clés de MDC posées par KDN-15 — `correlation_id`, `tenant_id` — s'y joignent telles
# quelles, en `snake_case`, comme les paires clé/valeur des lignes d'accès.
logging:
  structured:
    format:
      console: ecs
    json:
      # Micrometer Tracing publie ses identifiants en MDC sous `traceId`/`spanId`, sans
      # propriété pour en changer. On les réaligne ici sur le `snake_case` du reste des
      # champs (spec §10.7.1) : une clé de log est un contrat de recherche en aval, et deux
      # conventions de nommage dans la même ligne en font un piège permanent.
      rename:
        traceId: trace_id
        spanId: span_id

# Authentification (spec §9.2, §10.3, §10.6).
#
# **Aucun secret n'est ecrit ici, pas meme un secret « de developpement ».** `KADRAN_JWT_SECRET`
# vide fait tirer une cle aleatoire au demarrage : le poste de developpement fonctionne sans
# configuration, et un deploiement qui aurait oublie la variable se trahit au premier
# redemarrage — tous les jetons deviennent invalides — au lieu de tourner des mois avec une cle
# lisible dans un depot public. Voir `JwtSecretKeySource`.
kadran:
  security:
    jwt:
      secret: ${KADRAN_JWT_SECRET:}
      issuer: ${KADRAN_JWT_ISSUER:kadran}
      # Court : un jeton d'acces n'est pas revocable, sa fenetre d'abus vaut exactement sa
      # duree de vie. C'est le jeton de rafraichissement, lui revocable, qui porte la session.
      access-token-ttl: ${KADRAN_JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${KADRAN_JWT_REFRESH_TTL:30d}
    password:
      # A relever au fil du materiel, jamais a abaisser : les empreintes existantes portent
      # leur propre cout et restent verifiables.
      bcrypt-strength: ${KADRAN_BCRYPT_STRENGTH:12}

server:
  port: 8080

management:
  # **Port de management séparé** (spec §10.7.2, ADR-011). `/actuator/prometheus` publie la
  # topologie interne de l'application : il doit être joignable par le collecteur, par rien
  # d'autre. Ce port n'est exposé ni par le service web ni par l'ingress ; côté conteneur,
  # seul le port applicatif est publié.
  server:
    port: 8081

  endpoints:
    web:
      exposure:
        include: health,prometheus

  endpoint:
    health:
      # Le port de management n'est pas exposé hors du réseau interne : le détail des
      # contributeurs y est lisible, et c'est lui qui dit *pourquoi* une instance n'est pas
      # prête. Il n'y a là aucune donnée de tenant.
      show-details: always
      probes:
        enabled: true
      group:
        # **Sondes distinctes** (spec §10.7.4). La `readiness` dépend de la base : une
        # instance qui ne peut ni migrer ni requêter ne doit pas recevoir de trafic. La
        # `liveness` n'en dépend surtout pas — sans quoi une base indisponible ferait
        # redémarrer en boucle des instances parfaitement saines, et le redémarrage
        # n'accélérerait jamais le retour de la base.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

  # Micrometer Tracing, pont OpenTelemetry, propagation W3C `traceparent` (spec §10.7.3).
  # **Instrumentation en place, exportation non** : aucun exporteur OTLP n'est déclaré tant
  # qu'aucun collecteur n'existe. L'échantillonnage est donc à 1.0 — rien ne part sur le
  # réseau, et chaque ligne de log porte son `trace_id`, ce que §10.7.1 exige. À rabaisser
  # le jour où un exporteur est branché.
  tracing:
    sampling:
      probability: 1.0
