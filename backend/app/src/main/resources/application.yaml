spring:
  application:
    name: kadran

  # La journée d'exploitation et toutes les agrégations reposent sur Europe/Paris (§4.3).
  jackson:
    time-zone: Europe/Paris

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
