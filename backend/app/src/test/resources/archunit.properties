# Les paquets du domaine sont encore vides : le squelette KDN-3 ne livre aucun agrégat.
# Sans cette option, ArchUnit echouerait sur « rule failed to check any classes ».
#
# À BASCULER À `true` dès que les premiers agrégats existent (KDN-33 et suivantes) :
# une règle qui ne s'applique à rien est une règle qui ne protège rien, et le silence
# est ici indiscernable du succès.
archRule.failOnEmptyShould=false
